<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:380px;height:500px;background:#0d1117;color:#e6edf3;font-family:-apple-system,sans-serif;display:flex;flex-direction:column}
#header{padding:10px;background:#161b22;border-bottom:1px solid #30363d;font-weight:700;color:#e94560}
#messages{flex:1;overflow-y:auto;padding:8px;font-size:13px}
.msg{margin:4px 0;padding:8px;border-radius:8px;word-wrap:break-word}
.msg.user{background:#1f6feb;color:#fff}
.msg.assistant{background:#161b22;border:1px solid #30363d}
.msg.error{background:#3d1117;border:1px solid #f85149;color:#f85149}
#input-area{display:flex;padding:6px;gap:6px;background:#161b22;border-top:1px solid #30363d}
#input-area input{flex:1;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:8px;font-size:13px;outline:none}
#input-area button{background:#e94560;color:#fff;border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.typing{color:#8b949e;font-style:italic;font-size:12px;padding:4px 8px}
#server-url{padding:6px 10px;background:#161b22;border-bottom:1px solid #30363d;font-size:11px;display:flex;align-items:center;gap:4px}
#server-url input{background:#0d1117;color:#8b949e;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font-size:11px;width:180px;outline:none}
#server-url label{color:#8b949e}
</style>
</head>
<body>
<div id="header">★ VKCoder</div>
<div id="server-url">
  <label>Server:</label>
  <input id="url" value="http://localhost:3456" />
</div>
<div id="messages"></div>
<div id="input-area">
  <input id="input" placeholder="Ask VKCoder..." />
  <button onclick="send()">Send</button>
</div>
<script src="popup.js"></script>
</body>
</html>
